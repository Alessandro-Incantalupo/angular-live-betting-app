# Static demo: the app is built ahead of time and deployed from dist.
[build]
  command = "pnpm build"
  publish = "dist/live-odds/browser"

[build.environment]
  NODE_VERSION = "26"

# Every route is rendered in the browser: unknown paths get index.html, files win first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # script-src: our own bundles plus the inline theme script, by hash (scripts/check-csp.mjs).
    # style-src needs 'unsafe-inline': Angular adds component styles as <style> elements.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-GCrsYLGCAFRKXmdMBs5e/aNL1/DGaYQSvT94co6C1Tc='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"

# HTML keeps Netlify's default (revalidate on every visit), so a new deploy shows up at once.
# Bundles have a content hash in their name: a new build gets new names, so keep them for a year.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
