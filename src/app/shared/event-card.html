<article class="card">
  <p class="pills">
    <span class="pill sport">{{ event().sport }}</span><span class="visually-hidden">, </span
    ><span class="pill category">{{ event().category }}</span>
  </p>
  <h2 class="title">
    <a [routerLink]="['/events', event().id]">{{ name() }}</a>
  </h2>
  <dl class="prices">
    <!-- Tracked by value too: a new price is a new box, so the flash plays once per move. -->
    @for (price of prices(); track price.selection + price.value) {
      <div
        class="price"
        [class.price-up]="price.move === 'up'"
        [class.price-down]="price.move === 'down'"
      >
        <dt>
          <span aria-hidden="true">{{ price.code }}</span>
          <span class="visually-hidden">{{ price.label }}</span>
        </dt>
        <dd><app-odds-value [value]="price.value" [move]="price.move" /></dd>
      </div>
    }
  </dl>
</article>
