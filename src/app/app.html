<a class="skip-link" href="#main" (click)="skipToMain($event)">Skip to content</a>

<header class="topbar">
  <a class="brand" routerLink="/">
    <svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24">
      <path d="M3 17l5-6 4 4 8-10" fill="none" stroke="currentColor" stroke-width="2.5" />
    </svg>
    Live odds
  </a>
  <app-theme-toggle />
</header>

<app-live-controls />

<div class="layout">
  <app-sport-nav />
  <main id="main" tabindex="-1">
    <router-outlet />
  </main>
</div>

<footer class="footer">
  <p>
    A demo with simulated prices: no real events, no bets.
    <a href="https://github.com/Alessandro-Incantalupo/angular-live-betting-app" rel="noopener"
      >Source on GitHub</a
    >
  </p>
</footer>

<!-- Polite and atomic: read when the reader is idle, as one sentence. Empty unless opted in. -->
<div class="visually-hidden" aria-live="polite" aria-atomic="true">
  {{ announcements.message() }}
</div>
